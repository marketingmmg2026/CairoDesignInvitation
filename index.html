    --gold: #e9c98b;

  }
  /* If you have the Geometric 231 Heavy font file, put it next to index.html as geometric231-heavy.woff2 */
  @font-face{
    font-family:"Geo231";
    src: local("Geometric231 Hv BT"), local("Geometric 231 Heavy"), url("geometric231-heavy.woff2") format("woff2");
    font-weight:800; font-display:swap;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0b0f14;color:var(--white)}
  body{font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

  .pages{
    height:100vh;height:100dvh;
    overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;scroll-behavior:smooth;
  }
  .page{
    position:relative;height:100vh;height:100dvh;width:100%;
    scroll-snap-align:start;overflow:hidden;overflow:clip;
    display:flex;flex-direction:column;align-items:center;
  }
  .bg{
    position:absolute;inset:0;background:var(--bg) center 60%/cover no-repeat;
    will-change:transform;
  }

  /* ---------- PAGE 1 ---------- */
  .p1 .bg{animation:kenburns 22s ease-in-out infinite alternate}
  @keyframes kenburns{
    from{transform:scale(1.08) translateY(0)}
    to{transform:scale(1.18) translateY(-1.5%)}
  }
  /* soft warm glow pulsing over the lit shapes */
  .glow{
    position:absolute;left:0;right:0;bottom:22%;height:40%;
    background:radial-gradient(ellipse at 50% 60%,rgba(255,196,110,.28),transparent 65%);
    mix-blend-mode:screen;animation:pulse 4.5s ease-in-out infinite;pointer-events:none;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(5,8,12,.55),rgba(5,8,12,0) 45%,rgba(5,8,12,0) 70%,rgba(5,8,12,.55));pointer-events:none}

  /* drifting dust particles */
  .dust{position:absolute;inset:0;pointer-events:none}
  .dust i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;
    background:rgba(255,220,160,.8);box-shadow:0 0 6px rgba(255,200,120,.9);
    animation:rise linear infinite;opacity:0}
  @keyframes rise{
    0%{transform:translateY(0) translateX(0);opacity:0}
    15%{opacity:.9}
    100%{transform:translateY(-75vh) translateX(20px);opacity:0}
  }

  .hero{
    position:relative;z-index:2;text-align:center;
    margin-top:calc(9vh + env(safe-area-inset-top));padding:0 20px;
  }
  .brand{
    font-family:"Geo231","League Spartan","Futura","Century Gothic",sans-serif;
    font-weight:800;color:var(--white);
    font-size:clamp(46px,13vw,140px);letter-spacing:.04em;line-height:1;
    opacity:0;transform:translateY(-60vh);
    animation:drop 3.2s cubic-bezier(.16,.84,.3,1) .4s forwards;
    text-shadow:0 6px 30px rgba(0,0,0,.45);
  }
  @keyframes drop{
    0%{opacity:0;transform:translateY(-60vh)}
    35%{opacity:1}
    100%{opacity:1;transform:translateY(0)}
  }
  .line{width:0;height:1px;margin:22px auto 20px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
    animation:grow 1.4s ease 3.2s forwards}
  @keyframes grow{to{width:min(260px,60vw)}}
  .details{opacity:0;animation:fadeUp 1.4s ease 3.5s forwards}
  .details .event{font-weight:600;font-size:clamp(15px,4.2vw,24px);letter-spacing:.32em;text-transform:uppercase}
  .details .place{font-weight:300;font-size:clamp(13px,3.6vw,19px);letter-spacing:.22em;text-transform:uppercase;margin-top:10px;opacity:.9}
  .details .date{font-weight:500;font-size:clamp(13px,3.6vw,18px);letter-spacing:.3em;margin-top:18px;color:var(--gold)}
  .countdown{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);margin-top:26px}
  .countdown div{min-width:clamp(58px,15vw,84px);padding:12px 6px 10px;border:1px solid rgba(255,255,255,.22);border-radius:14px;
    background:rgba(10,12,16,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .countdown b{display:block;font-weight:500;font-size:clamp(22px,6.5vw,36px);letter-spacing:.04em;font-variant-numeric:tabular-nums}
  .countdown span{display:block;margin-top:4px;font-size:clamp(9px,2.4vw,11px);letter-spacing:.25em;text-transform:uppercase;opacity:.7}
  .cd-live{display:none;margin-top:24px;font-weight:600;font-size:clamp(13px,3.6vw,16px);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .hint{
    position:absolute;z-index:2;left:50%;transform:translateX(-50%);
    bottom:calc(26px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.35em;text-transform:uppercase;font-weight:500;
    color:rgba(255,255,255,.85);text-decoration:none;
    opacity:0;animation:fadeIn 1s ease 4.6s forwards;
  }
  .hint .arrow{width:14px;height:14px;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;
    transform:rotate(45deg);animation:bounce 1.8s ease-in-out infinite}
  @keyframes bounce{0%,100%{transform:translateY(0) rotate(45deg);opacity:.5}50%{transform:translateY(7px) rotate(45deg);opacity:1}}
  @keyframes fadeIn{to{opacity:1}}

  /* ---------- PAGE 2 ---------- */
  .p2 .bg{filter:blur(14px) brightness(.55);transform:scale(1.12)}
  .p2{justify-content:center}
  .rsvp{position:relative;z-index:2;text-align:center;padding:0 24px;width:100%;max-width:560px}
  .rsvp .small{font-family:"Geo231","League Spartan",sans-serif;font-weight:800;letter-spacing:.18em;font-size:clamp(16px,4vw,20px);opacity:.9}
  .rsvp h2{font-weight:300;font-size:clamp(26px,7vw,46px);letter-spacing:.06em;line-height:1.25;margin:18px 0 10px}
  .rsvp p{font-weight:400;font-size:clamp(12px,3.2vw,14px);letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .btns{display:flex;gap:14px;justify-content:center;margin:14px auto 0;flex-wrap:wrap;max-width:420px}
  .btns .btn{flex:1 1 0;min-width:0;padding:17px 10px;white-space:nowrap;letter-spacing:.14em;font-size:clamp(11px,3.1vw,13px)}
  .btn{
    font-family:inherit;font-size:13px;font-weight:600;letter-spacing:.25em;text-transform:uppercase;
    padding:17px 26px;min-width:190px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.06);color:#fff;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:background .3s,color .3s,transform .2s,opacity .3s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.yes{background:#fff;color:#111;border-color:#fff}
  .btn.yes:hover{background:var(--gold);border-color:var(--gold)}
  .btn.no:hover{background:rgba(255,255,255,.18)}
  .btn:disabled{opacity:.5;cursor:default;transform:none}
  .btn.locked{opacity:.4;cursor:not-allowed;transform:none}
  .namebox{margin:34px auto 0;max-width:420px}
  #guestName{width:100%;padding:16px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.55);
    background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:16px;letter-spacing:.06em;text-align:center;outline:none;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .3s,background .3s}
  #guestName::placeholder{color:rgba(255,255,255,.6);letter-spacing:.18em;text-transform:uppercase;font-size:13px}
  #guestName:focus{border-color:var(--gold);background:rgba(255,255,255,.12)}
  #guestName.bad{border-color:#ff8a7a;animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .nameerr{height:18px;margin-top:8px;font-size:12px;letter-spacing:.1em;color:#ff9f92;opacity:0;transition:opacity .3s}
  .nameerr.show{opacity:1}
  .msg{margin-top:26px;min-height:22px;font-size:14px;letter-spacing:.08em;color:var(--gold);opacity:0;transition:opacity .5s}
  .msg.show{opacity:1}
  .change{display:none;margin-top:12px;background:none;border:0;color:rgba(255,255,255,.7);font-family:inherit;font-size:12px;letter-spacing:.15em;text-decoration:underline;cursor:pointer}

  /* ---------- ADMIN (open the link with #admin) ---------- */
  .admin{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(5,8,12,.85);backdrop-filter:blur(8px)}
  .admin.on{display:flex}
  .card{width:min(420px,90vw);padding:32px 26px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:rgba(255,255,255,.05);text-align:center}
  .card h3{font-weight:500;letter-spacing:.25em;text-transform:uppercase;font-size:13px;opacity:.8}
  .stats{display:flex;gap:14px;margin:24px 0}
  .stat{flex:1;padding:18px 8px;border-radius:14px;background:rgba(255,255,255,.07)}
  .stat b{display:block;font-size:42px;font-weight:600}
  .stat span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
  .card small{opacity:.6;font-size:12px}
  .card > button{margin-top:16px;letter-spacing:.14em;font-size:12px}
  .card{max-height:92vh;max-height:92dvh;display:flex;flex-direction:column}
  .stat{font-family:inherit;color:#fff;border:1px solid transparent;cursor:pointer;transition:background .25s,border-color .25s}
  .stat:hover{background:rgba(255,255,255,.12)}
  .stat.active{border-color:var(--gold);background:rgba(233,201,139,.12)}
  .stat span::after{content:" ▾";opacity:.6}
  .names{display:none;text-align:left;margin-bottom:14px;min-height:0;flex:1 1 auto;overflow:hidden;flex-direction:column}
  .names.show{display:flex}
  .names-head{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);padding:0 4px 10px;border-bottom:1px solid rgba(255,255,255,.15)}
  .names ol{list-style:none;overflow-y:auto;min-height:120px;flex:1 1 auto;counter-reset:n;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .names-search{width:100%;margin:12px 0 4px;padding:11px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;font-size:14px;outline:none}
  .names-search::placeholder{color:rgba(255,255,255,.5)}
  .names-search:focus{border-color:var(--gold)}
  .names li span{min-width:0;overflow-wrap:anywhere;line-height:1.35}
  .stat b{font-variant-numeric:tabular-nums}
  .names li{counter-increment:n;display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
  .names li::before{content:counter(n)".";opacity:.45;min-width:26px}
  .names li span{flex:1}
  .names li time{opacity:.5;font-size:12px;white-space:nowrap}
  .names .empty{opacity:.6;font-size:14px;justify-content:center}
  .names .empty::before{content:none}

  @media (orientation:landscape) and (min-width:900px){
    .bg{background-position:center 62%}
    .hero{margin-top:7vh}
  }
  @media (prefers-reduced-motion:reduce){
    .p1 .bg,.glow,.dust i,.hint .arrow{animation:none}
    .brand,.details,.hint{animation-duration:.01s;animation-delay:0s}
    .line{animation-delay:0s;animation-duration:.01s}
  }
</style>
</head>
<body>
<main class="pages" id="pages">

  <!-- PAGE 1 -->
  <section class="page p1">
    <div class="bg"></div>
    <div class="glow"></div>
    <div class="shade"></div>
    <div class="dust" id="dust"></div>

    <div class="hero">
      <h1 class="brand">MARMONIL</h1>
      <div class="line"></div>
      <div class="details">
        <div class="event">Cairo Design Week</div>
        <div class="place">Egyptian Museum</div>
        <div class="date">21 NOV 2026</div>
        <div class="countdown" id="countdown">
          <div><b id="cdD">00</b><span>Days</span></div>
          <div><b id="cdH">00</b><span>Hours</span></div>
          <div><b id="cdM">00</b><span>Min</span></div>
          <div><b id="cdS">00</b><span>Sec</span></div>
        </div>
        <div class="cd-live" id="cdLive"></div>
      </div>
    </div>

    <a class="hint" href="#rsvp">Scroll down<span class="arrow"></span></a>
  </section>

  <!-- PAGE 2 -->
  <section class="page p2" id="rsvp">
    <div class="bg"></div>
    <div class="rsvp">
      <div class="small">MARMONIL</div>
      <h2>Confirm your attendance</h2>
      <p>Cairo Design Week · 21 Nov 2026</p>
      <div class="namebox">
        <input id="guestName" type="text" placeholder="Enter your name" autocomplete="name" maxlength="80" required>
        <div class="nameerr" id="nameErr">Please enter your name first</div>
      </div>
      <div class="btns">
        <button class="btn yes" data-status="attending">Attending</button>
        <button class="btn no" data-status="not_attending">Not Attending</button>
      </div>
      <div class="msg" id="msg"></div>
      <button class="change" id="change">Change my answer</button>
    </div>
  </section>
</main>

<!-- ADMIN COUNTER -->
<div class="admin" id="admin">
  <div class="card">
    <h3>RSVP Count</h3>
    <div class="stats">
      <button class="stat" data-list="attending"><b id="cYes">–</b><span>Attending</span></button>
      <button class="stat" data-list="not_attending"><b id="cNo">–</b><span>Not attending</span></button>
    </div>
    <div class="names" id="namesBox">
      <div class="names-head" id="namesHead"></div>
      <input class="names-search" id="namesSearch" type="search" placeholder="Search name…" autocomplete="off">
      <ol id="namesList"></ol>
    </div>
    <small id="adminNote">Loading…</small><br>
    <button class="btn no" id="dlBtn">Download Excel</button>
  </div>
</div>

<script>
/* ====== PUT YOUR SUPABASE DETAILS HERE ====== */
const SUPABASE_URL = "https://xlopcvrjzbqfqmhorlpu.supabase.co";
const SUPABASE_KEY = "sb_publishable_XcUzFVaIyJmdbkuos4kP9A_TQ286NTQ";
const READY = !!(SUPABASE_URL && SUPABASE_KEY);
function rpc(name, body){
  return fetch(SUPABASE_URL.trim().replace(/\/+$/,'').replace(/\/rest\/v1$/,'')+'/rest/v1/rpc/'+name,{
    method:'POST',
    headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})
  }).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json().catch(()=>null); });
}

/* dust particles */
(function(){
  const d=document.getElementById('dust');
  for(let i=0;i<22;i++){
    const p=document.createElement('i');
    p.style.left=(Math.random()*100)+'%';
    p.style.animationDuration=(9+Math.random()*10)+'s';
    p.style.animationDelay=(Math.random()*10)+'s';
    const s=1.5+Math.random()*2.5; p.style.width=p.style.height=s+'px';
    d.appendChild(p);
  }
})();

/* countdown — Cairo time (UTC+2) */
const START = new Date("2026-11-21T00:00:00+02:00");
const END   = new Date("2026-11-22T00:00:00+02:00");
(function(){
  const box=document.getElementById('countdown'), live=document.getElementById('cdLive');
  const pad=n=>String(n).padStart(2,'0');
  function tick(){
    const now=Date.now(), diff=START-now;
    if(diff<=0){
      box.style.display='none'; live.style.display='block';
      live.textContent = now<END ? 'Today · See you there' : 'Thank you for visiting';
      return;
    }
    const s=Math.floor(diff/1000);
    document.getElementById('cdD').textContent=pad(Math.floor(s/86400));
    document.getElementById('cdH').textContent=pad(Math.floor(s%86400/3600));
    document.getElementById('cdM').textContent=pad(Math.floor(s%3600/60));
    document.getElementById('cdS').textContent=pad(s%60);
  }
  tick(); setInterval(tick,1000);
})();

/* device id so one phone = one answer (re-answering updates it) */
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null}}
let id=store('mm_id');
if(!id){ id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)); store('mm_id',id); }

const msg=document.getElementById('msg'), change=document.getElementById('change');
const btns=[...document.querySelectorAll('.rsvp .btn')];
const TEXT={attending:"Thank you — we look forward to seeing you!",not_attending:"Thank you for letting us know. You'll be missed."};
const nameIn=document.getElementById('guestName'), nameErr=document.getElementById('nameErr'), nameBox=nameIn.parentElement;
const nameOk=()=>nameIn.value.trim().length>=2;
function lockBtns(){ btns.forEach(b=>b.classList.toggle('locked',!nameOk())); }
nameIn.value=store('mm_name')||''; lockBtns();
nameIn.addEventListener('input',()=>{ lockBtns(); if(nameOk()){nameErr.classList.remove('show');nameIn.classList.remove('bad');} });

function showDone(status){
  btns.forEach(b=>b.style.display='none'); nameBox.style.display='none';
  const n=(store('mm_name')||'').split(' ')[0];
  msg.textContent=(n?n+', ':'')+TEXT[status].charAt(0).toLowerCase()+TEXT[status].slice(1);
  if(!n) msg.textContent=TEXT[status];
  msg.classList.add('show');
  change.style.display='inline-block';
}
const prev=store('mm_status'); if(prev && TEXT[prev]) showDone(prev);

change.onclick=()=>{btns.forEach(b=>{b.style.display='';b.disabled=false});nameBox.style.display='';lockBtns();msg.classList.remove('show');change.style.display='none'};

btns.forEach(b=>b.addEventListener('click',async()=>{
  if(!nameOk()){
    nameErr.classList.add('show'); nameIn.classList.remove('bad'); void nameIn.offsetWidth; nameIn.classList.add('bad'); nameIn.focus();
    return;
  }
  const status=b.dataset.status, name=nameIn.value.trim().replace(/\s+/g,' ');
  btns.forEach(x=>x.disabled=true); nameIn.disabled=true;
  msg.textContent='Sending…'; msg.classList.add('show');
  try{
    if(READY){ await rpc('submit_rsvp',{p_id:id,p_status:status,p_name:name}); }
    store('mm_name',name); store('mm_status',status); showDone(status);
  }catch(e){
    msg.textContent='Connection problem, please try again.';
  }
  btns.forEach(x=>x.disabled=false); nameIn.disabled=false;
}));

/* admin view: open the site link with #admin at the end */
async function loadCounts(){
  const note=document.getElementById('adminNote');
  if(!READY){note.textContent='Add your Supabase URL and key to see counts.';return}
  try{
    let j=await rpc('rsvp_counts'); if(Array.isArray(j)) j=j[0];
    document.getElementById('cYes').textContent=j.attending;
    document.getElementById('cNo').textContent=j.not_attending;
    note.textContent='Total: '+(j.attending+j.not_attending)+' · updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch(e){note.textContent='Could not load counts — retrying…'}
}
/* names list */
let openList=null;
const namesBox=document.getElementById('namesBox'), namesList=document.getElementById('namesList'), namesHead=document.getElementById('namesHead');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const namesSearch=document.getElementById('namesSearch');
let rowsNow=[], renderedKey='';
function renderNames(){
  const q=namesSearch.value.trim().toLowerCase();
  const list=q?rowsNow.filter(r=>(r.name||'').toLowerCase().includes(q)):rowsNow;
  const key=openList+'|'+q+'|'+JSON.stringify(rowsNow);
  if(key===renderedKey) return;            // nothing changed -> don't touch the list (keeps scroll position)
  renderedKey=key;
  const top=namesList.scrollTop;
  namesHead.textContent=(openList==='attending'?'Attending':'Not attending')+' · '+rowsNow.length+(q?' · showing '+list.length:'');
  namesList.innerHTML=list.length?list.map(r=>'<li><span>'+esc(r.name||'—')+'</span><time>'+
    new Date(r.updated_at).toLocaleString([], {day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+'</time></li>').join('')
    :'<li class="empty">'+(q?'No match':'No one yet')+'</li>';
  namesList.scrollTop=top;
}
async function loadNames(){
  if(!openList||!READY) return;
  const which=openList;
  try{
    const rows=await rpc('rsvp_names',{p_status:which})||[];
    if(which!==openList) return;           // user switched lists meanwhile
    rowsNow=rows; renderNames();
    namesBox.classList.add('show');
  }catch(e){}
}
namesSearch.addEventListener('input',()=>{ renderNames(); namesList.scrollTop=0; });
document.querySelectorAll('.stat').forEach(s=>s.addEventListener('click',()=>{
  const k=s.dataset.list;
  if(openList===k){ openList=null; s.classList.remove('active'); namesBox.classList.remove('show'); return; }
  openList=k; rowsNow=[]; renderedKey=''; namesSearch.value=''; namesList.scrollTop=0;
  document.querySelectorAll('.stat').forEach(x=>x.classList.toggle('active',x===s));
  loadNames();
}));

function refreshAll(){ loadCounts(); loadNames(); }

/* Excel download: always ONE file with two tabs (Attending / Not Attending), styled in the site colors */
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  return new Promise((ok,no)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    s.onload=()=>ok(window.ExcelJS); s.onerror=no; document.head.appendChild(s);
  });
}
const fmt=d=>new Date(d).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function saveBlob(blob,name){
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
const XC={dark:'FF0B0F14',dark2:'FF1A1F26',gold:'FFE9C98B',goldDeep:'FFB8924A',white:'FFFFFFFF',cream:'FFFAF6EE',text:'FF1A1F26',muted:'FF8A8F98',line:'FFE5D6B4'};
function buildSheet(wb,title,rows,tabColor,total){
  const ws=wb.addWorksheet(title,{properties:{tabColor:{argb:tabColor}},views:[{state:'frozen',ySplit:5,showGridLines:false}]});
  ws.columns=[{key:'n',width:8},{key:'name',width:40},{key:'time',width:24}];
  const font='Montserrat';
  const band=(r,h)=>{ ws.getRow(r).height=h; for(let c=1;c<=3;c++) ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.dark}}; };
  // row 1: brand
  band(1,44); ws.mergeCells('A1:C1');
  Object.assign(ws.getCell('A1'),{value:'MARMONIL'});
  ws.getCell('A1').font={name:font,size:24,bold:true,color:{argb:XC.white}};
  ws.getCell('A1').alignment={horizontal:'center',vertical:'middle'};
  // row 2: event line
  band(2,22); ws.mergeCells('A2:C2');
  ws.getCell('A2').value='CAIRO DESIGN WEEK  ·  EGYPTIAN MUSEUM  ·  21 NOV 2026';
  ws.getCell('A2').font={name:font,size:10,bold:true,color:{argb:XC.gold}};
  ws.getCell('A2').alignment={horizontal:'center',vertical:'middle'};
  // row 3: list name + count
  band(3,26); ws.mergeCells('A3:C3');
  ws.getCell('A3').value=title.toUpperCase()+'  —  '+rows.length+(total!=null?'  of  '+total+' responses':'');
  ws.getCell('A3').font={name:font,size:11,color:{argb:XC.white}};
  ws.getCell('A3').alignment={horizontal:'center',vertical:'middle'};
  // row 4: thin gold line
  ws.getRow(4).height=4; for(let c=1;c<=3;c++) ws.getCell(4,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.gold}};
  // row 5: header
  const hdr=ws.getRow(5); hdr.values=['#','Name','Response time']; hdr.height=24;
  hdr.eachCell(c=>{
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:XC.dark2}};
    c.font={name:font,size:10,bold:true,color:{argb:XC.gold}};
    c.alignment={horizontal:c.col===2?'left':'center',vertical:'middle',indent:c.col===2?1:0};
  });
  // data
  rows.forEach((r,i)=>{
    const row=ws.addRow([i+1,r.name||'',fmt(r.updated_at)]); row.height=20;
    row.eachCell({includeEmpty:true},c=>{
      c.fill={type:'pattern',pattern:'solid',fgColor:{argb:i%2?XC.cream:XC.white}};
      c.font={name:font,size:11,color:{argb:c.col===1||c.col===3?XC.muted:XC.text}};
      c.alignment={horizontal:c.col===2?'left':'center',vertical:'middle',indent:c.col===2?1:0};
      c.border={bottom:{style:'thin',color:{argb:XC.line}}};
    });
  });
  if(!rows.length){
    const row=ws.addRow(['','No one yet','']); row.getCell(2).font={name:font,italic:true,color:{argb:XC.muted}};
  }
  ws.autoFilter={from:{row:5,column:1},to:{row:5,column:3}};
  ws.pageSetup={paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'1:5'};
}
async function downloadExcel(){
  const btn=document.getElementById('dlBtn'); if(!READY) return;
  const old=btn.textContent; btn.textContent='Preparing…'; btn.disabled=true;
  try{
    const att=await rpc('rsvp_names',{p_status:'attending'})||[];
    const not=await rpc('rsvp_names',{p_status:'not_attending'})||[];
    const total=att.length+not.length, day=new Date().toISOString().slice(0,10);
    const fname='MARMONIL_RSVP_'+day;
    try{
      const E=await loadExcelJS(), wb=new E.Workbook();
      wb.creator='MARMONIL'; wb.created=new Date();
      buildSheet(wb,'Attending',att,XC.gold,total);
      buildSheet(wb,'Not Attending',not,XC.muted,total);
      const buf=await wb.xlsx.writeBuffer();
      saveBlob(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),fname+'.xlsx');
    }catch(e){
      // fallback: CSV that Excel opens (no colors)
      const lines=['Status,#,Name,Response time'];
      [['Attending',att],['Not Attending',not]].forEach(([l,rs])=>rs.forEach((r,i)=>lines.push([l,i+1,'"'+String(r.name||'').replace(/"/g,'""')+'"','"'+fmt(r.updated_at)+'"'].join(','))));
      saveBlob(new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),fname+'.csv');
    }
  }catch(e){ document.getElementById('adminNote').textContent='Could not download, try again.'; }
  btn.textContent=old; btn.disabled=false;
}
document.getElementById('dlBtn').onclick=downloadExcel;
let adminTimer=null;
function route(){
  const on=location.hash==='#admin';
  document.getElementById('admin').classList.toggle('on',on);
  clearInterval(adminTimer);
  if(on){ refreshAll(); adminTimer=setInterval(refreshAll,5000); }  // auto-refresh every 5 seconds
}

addEventListener('hashchange',route); route();
</script>
</body>
</html>
